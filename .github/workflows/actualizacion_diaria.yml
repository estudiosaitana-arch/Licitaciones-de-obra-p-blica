name: Actualización diaria

# Lee la Plataforma de Contratación, actualiza la base y guarda los resultados (CSV y Excel) en datos/.
# Para cambiar el ámbito o el rango de importes, edita los argumentos del paso "Leer la Plataforma".

on:
  schedule:
    - cron: "15 5 * * 1-5"   # lunes a viernes, 07:15 (verano) / 06:15 (invierno) hora peninsular
  workflow_dispatch:
    inputs:
      meses:
        description: "Carga inicial: número de ficheros mensuales a descargar (0 = ninguno)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: actualizacion-licitaciones
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Europe/Madrid
      PYTHONUNBUFFERED: "1"
      MESES: ${{ inputs.meses || '0' }}
      FEED: https://contrataciondelestado.es/sindicacion/sindicacion_643/licitacionesPerfilesContratanteCompleto3.atom
      ZIPS: https://contrataciondelsectorpublico.gob.es/sindicacion/sindicacion_643/licitacionesPerfilesContratanteCompleto3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar acceso a la Plataforma
        # Falla en menos de un minuto si los servidores de GitHub no pueden conectar con la Plataforma,
        # en lugar de agotar los reintentos de descarga.
        run: |
          comprueba() {  # $1 descripción, $2 URL, $3 opciones de curl
            echo "→ $1"
            if ! cabeceras=$(curl -sS $3 -m 40 -D - -o /dev/null -w "tiempo %{time_total} s\n" "$2" 2>&1); then
              echo "::error::Sin acceso a $1 desde GitHub: $cabeceras"
              return 1
            fi
            echo "$cabeceras" | grep -iE "^HTTP/|^content-length|^tiempo" | sed 's/^/   /'
            codigo=$(echo "$cabeceras" | grep -E "^HTTP/" | tail -1 | awk '{print $2}')
            case "$codigo" in
              2*) ;;
              *) echo "::error::$1 responde HTTP $codigo"; return 1 ;;
            esac
          }
          comprueba "Feed ATOM" "$FEED" ""
          if [ "$MESES" != "0" ]; then
            comprueba "Fichero mensual $(date +%Y%m)" "${ZIPS}_$(date +%Y%m).zip" "-I"
          fi

      - name: Instalar openpyxl (salida Excel)
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Leer la Plataforma y actualizar la base
        run: |
          python licitaciones_obras.py \
            --meses "$MESES" \
            --min 500000 --max 10000000 \
            --base datos/base_licitaciones.json \
            --salida datos/licitaciones_en_plazo.csv \
            --salida datos/licitaciones_en_plazo.xlsx | tee resumen.txt

      - name: Publicar el resumen en la ejecución
        run: |
          {
            echo '```'
            cat resumen.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Actualización de licitaciones $(date +%F)"
            git push
          fi
