name: Actualización diaria

# Lee la Plataforma de Contratación, actualiza la base y guarda los resultados (CSV y Excel) en datos/.
# Para cambiar el ámbito o el rango de importes, edita los argumentos del paso "Leer la Plataforma".

on:
  schedule:
    - cron: "15 5 * * 1-5"   # lunes a viernes, 07:15 (verano) / 06:15 (invierno) hora peninsular
  workflow_dispatch:
    inputs:
      meses:
        description: "Carga inicial: número de ficheros mensuales a descargar (0 = ninguno)"
        required: false
        default: "0"
      forzar_correo:
        description: "Enviar el correo aunque no haya novedades (prueba)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: actualizacion-licitaciones
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TZ: Europe/Madrid
      PYTHONUNBUFFERED: "1"
      MESES: ${{ inputs.meses || '0' }}
      FEED: https://contrataciondelestado.es/sindicacion/sindicacion_643/licitacionesPerfilesContratanteCompleto3.atom
      ZIPS: https://contrataciondelsectorpublico.gob.es/sindicacion/sindicacion_643/licitacionesPerfilesContratanteCompleto3
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Comprobar acceso a la Plataforma
        # Falla en menos de un minuto si los servidores de GitHub no pueden conectar con la Plataforma,
        # en lugar de agotar los reintentos de descarga.
        run: |
          comprueba() {  # $1 descripción, $2 URL, $3 opciones de curl
            echo "→ $1"
            # Basta con recibir la respuesta: si llega HTTP 2xx hay acceso, aunque el cuerpo
            # (varios MB en el feed) no termine de descargarse en el tiempo de la prueba.
            cabeceras=$(curl -sS $3 -m 20 -D - -o /dev/null -w "tiempo %{time_total} s\n" "$2" 2>&1) || true
            echo "$cabeceras" | grep -iE "^HTTP/|^content-length|^tiempo|^curl:" | sed 's/^/   /'
            codigo=$(echo "$cabeceras" | grep -E "^HTTP/" | tail -1 | awk '{print $2}')
            case "$codigo" in
              2*) echo "   Acceso correcto (HTTP $codigo)" ;;
              "") echo "::error::Sin acceso a $1 desde GitHub"; return 1 ;;
              *) echo "::error::$1 responde HTTP $codigo"; return 1 ;;
            esac
          }
          comprueba "Feed ATOM" "$FEED" ""
          if [ "$MESES" != "0" ]; then
            comprueba "Fichero mensual $(date +%Y%m)" "${ZIPS}_$(date +%Y%m).zip" "-I"
          fi

      - name: Instalar openpyxl (salida Excel)
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Leer la Plataforma y actualizar la base
        run: |
          python licitaciones_obras.py \
            --meses "$MESES" \
            --min 500000 \
            --base datos/base_licitaciones.json \
            --salida datos/licitaciones_en_plazo.csv \
            --salida datos/licitaciones_en_plazo.xlsx | tee resumen.txt

      - name: Publicar el resumen en la ejecución
        run: |
          {
            echo '```'
            cat resumen.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Actualización de licitaciones $(date +%F)"
            git push
          fi

      - name: Comprobar si hay que enviar el correo
        id: novedades
        env:
          USUARIO: ${{ secrets.GMAIL_USUARIO }}
          CLAVE: ${{ secrets.GMAIL_CONTRASENA_APP }}
          DESTINO: ${{ secrets.CORREO_DESTINO }}
          FORZAR: ${{ inputs.forzar_correo || false }}
        run: |
          nuevas=$(grep -oP 'Nuevas desde[^:]*:\s*\K[0-9]+' resumen.txt || echo 0)
          cambios=$(grep -oP 'Con cambios[^:]*:\s*\K[0-9]+' resumen.txt || echo 0)
          echo "Nuevas: $nuevas · Con cambios: $cambios"
          enviar=false
          if [ "$nuevas" -gt 0 ] || [ "$cambios" -gt 0 ]; then enviar=true; fi
          if [ "$FORZAR" = "true" ]; then echo "Envío forzado desde la ejecución manual."; enviar=true; fi
          if [ -z "$USUARIO" ] || [ -z "$CLAVE" ] || [ -z "$DESTINO" ]; then
            echo "::notice::No se envía correo: faltan los secretos GMAIL_USUARIO, GMAIL_CONTRASENA_APP o CORREO_DESTINO."
            enviar=false
          fi
          {
            echo "nuevas=$nuevas"
            echo "cambios=$cambios"
            echo "enviar=$enviar"
            echo "fecha=$(date +%d/%m/%Y)"
          } >> "$GITHUB_OUTPUT"

      - name: Enviar el Excel por correo
        # Solo si hay obras nuevas o con cambios (o envío forzado). Cuenta Gmail con contraseña de aplicación.
        if: steps.novedades.outputs.enviar == 'true'
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USUARIO }}
          password: ${{ secrets.GMAIL_CONTRASENA_APP }}
          from: Licitaciones de obra <${{ secrets.GMAIL_USUARIO }}>
          to: ${{ secrets.CORREO_DESTINO }}
          subject: "Licitaciones de obra ${{ steps.novedades.outputs.fecha }}: ${{ steps.novedades.outputs.nuevas }} nuevas, ${{ steps.novedades.outputs.cambios }} con cambios"
          body: file://resumen.txt
          attachments: datos/licitaciones_en_plazo.xlsx
